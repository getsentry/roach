name: Roach
description: Run a command with its HTTPS traffic recorded and replayed by the Roach service.

inputs:
  run:
    description: The command to run, in bash. Only this command uses the proxy.
    required: true
  token:
    description: >-
      The write token of the service. Give it only to workflows that you
      trust. Set this or read-token.
    required: false
  read-token:
    description: >-
      The read token of the service. With only this token, the run can only
      replay. Set this or token.
    required: false
  url:
    description: The URL of the Roach service.
    required: false
    default: https://roach-proxy.getsentry.net

runs:
  using: node24
  main: packages/roach/src/action.ts
