minVersion: "2.21.0"
changelog:
  policy: auto
# Without a preReleaseCommand, Craft writes the version to package.json
# for the npm target.
targets:
  # The client and the vitest integration. CI uploads the tarball of each
  # commit as the artifact `<sha>`.
  - name: npm
    access: public
  # The service image. The Image workflow pushes `:<sha>` for the release
  # branch, and Craft copies it to `:<version>`.
  - name: docker
    source: ghcr.io/getsentry/roach
    target: ghcr.io/getsentry/roach
  # The action. Repositories use `getsentry/roach@v<major>`.
  - name: github
    tagPrefix: v
    floatingTags:
      - "v{major}"
