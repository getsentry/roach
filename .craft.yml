minVersion: "3.9.0"
changelog:
  policy: auto
  # Add a short AI summary above the entries of each release. The Release
  # workflow gives Craft the workflow token for it.
  aiSummary:
    levels: [release]
# Write the version only to `@sentry/roach` (packages/roach/package.json).
# See the script for why Craft does not do it on its own.
preReleaseCommand: sh .github/scripts/bump-version.sh
targets:
  # The client and the vitest integration. CI uploads the tarball of each
  # commit as the artifact `<sha>`.
  - name: npm
    id: "@sentry/roach"
    includeNames: /^sentry-roach-\d.*\.tgz$/
    access: public
  # The service image. The Image workflow pushes `:<sha>` for the release
  # branch, and Craft copies it to `:<version>`.
  - name: docker
    source: ghcr.io/getsentry/roach
    target: ghcr.io/getsentry/roach
  # The action. Repositories use `getsentry/roach@v<major>`.
  - name: github
    tagPrefix: v
    floatingTags:
      - "v{major}"
