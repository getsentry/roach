name: Release

# Craft makes a release branch, and a release manager accepts it in
# getsentry/publish. See "Release" in README.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version bump type
        required: true
        type: choice
        default: minor
        options:
          - minor
          - patch
          - major
      force:
        description: Force release (bypass blockers)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Release a new version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Use the token of Sentry Release Bot, not GITHUB_TOKEN. A push with
      # GITHUB_TOKEN starts no workflows, so the release branch would get no
      # CI checks and no image. GITHUB_TOKEN also cannot open the issue in
      # getsentry/publish.
      - name: Get auth token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare release
        uses: getsentry/craft@4b763f5419255bb520e3e5a49f5b91426dcd374d # v2
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        with:
          version: ${{ inputs.version }}
          force: ${{ inputs.force && 'true' || 'false' }}
